[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true

# Gas reporting
gas_reports = ["*"]
gas_reports_ignore = []

# Testing
verbosity = 3
fuzz_runs = 256
fuzz_max_test_rejects = 65536

[profile.ci]
fuzz_runs = 10000

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
localhost = "http://localhost:8545"

[etherscan]
monad_testnet = { key = "${MONAD_EXPLORER_KEY}", url = "${MONAD_EXPLORER_URL}" }

# Compiler settings for optimization
[profile.default.optimizer_details]
peephole = true
inliner = true
jumpdestRemover = true
orderLiterals = true
deduplicate = true
cse = true
constantOptimizer = true
yul = true

[profile.default.optimizer_details.yulDetails]
stackAllocation = true
optimizerSteps = "dhfoDgvulfnTUtnIf"