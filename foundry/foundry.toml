[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc_version = "0.8.30"
chain_id = 10143

optimizer = true
optimizer_runs = 200
via_ir = true

verbosity = 3

# Gas reports
gas_reports = ["*"]

# -------------------------
# Fuzzing (correct format)
# -------------------------
[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.ci.fuzz]
runs = 10000

# -------------------------
# RPC endpoints
# -------------------------
[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
localhost = "http://127.0.0.1:8545"

# -------------------------
# Block explorer (Monad)
# -------------------------
[etherscan]
monad_testnet = {key = "monad",url = "${MONAD_EXPLORER_URL}"}


# -------------------------
# Advanced optimizer tuning
# -------------------------
[profile.default.optimizer_details]
peephole = true
inliner = true
jumpdestRemover = true
orderLiterals = true
deduplicate = true
cse = true
constantOptimizer = true
yul = true

[profile.default.optimizer_details.yulDetails]
stackAllocation = true
optimizerSteps = "dhfoDgvulfnTUtnIf"
